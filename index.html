<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>omegaa</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#0b0b0c;
    --card:rgba(255,255,255,0.035);
    --card-hover:rgba(255,255,255,0.065);
    --border:rgba(255,255,255,0.09);
    --border-hover:rgba(255,255,255,0.28);
    --white:#f2f2f3;
    --mid:#a3a3a8;
    --muted:#707076;
    --dim:#4a4a4f;
  }
  html{background:var(--bg);scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--white);
    font-family:'Nunito Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
  }

  /* animated network background */
  #bg-canvas{position:fixed;inset:0;z-index:0;display:block;}

  /* topbar */
  .topbar{
    position:fixed;top:0;left:0;right:0;
    display:flex;align-items:center;justify-content:space-between;
    padding:24px 32px;z-index:10;
  }  .topbar-id{font-family:'Nunito',sans-serif;font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);}
  .badge{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--mid);}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--mid);}

  /* page */
  .page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px 40px;gap:28px;text-align:center;}

  .avatar-wrap{
    position:relative;
    display:inline-block;
    perspective:900px;
  }
  .avatar{
    width:96px;height:96px;border-radius:50%;object-fit:cover;display:block;
    border:1px solid var(--border);
    box-shadow:0 0 0 6px rgba(255,255,255,0.05);
    transition:
      transform 0.25s ease-out,
      box-shadow 0.35s ease,
      border-color 0.35s ease;
    transform-style:preserve-3d;
    will-change:transform;
  }
  .avatar-wrap:hover .avatar{
    border-color:rgba(255,255,255,0.18);
    box-shadow:
      0 0 0 6px rgba(255,255,255,0.06),
      0 4px 14px rgba(0,0,0,0.2);
  }

  .name{font-family:'Nunito',sans-serif;font-size:clamp(46px,11vw,72px);font-weight:900;line-height:.95;letter-spacing:-.04em;color:var(--white);}
  .bio{margin-top:10px;font-size:14px;font-weight:600;color:var(--mid);letter-spacing:-.01em;}

  /* stats strip */
  .stats{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:12.5px;color:var(--dim);}
  .stats b{color:var(--mid);font-weight:700;}

  /* links */
  .links-block{width:100%;max-width:340px;text-align:left;}
  .links-label{font-size:9.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:2px;}
  .links{display:flex;flex-direction:column;}
  .link{
    position:relative;display:flex;align-items:center;gap:12px;
    font-size:14.5px;font-weight:700;color:var(--mid);
    border-bottom:1px solid var(--border);
    padding:13px 2px;text-decoration:none;
    transition:color .15s ease,padding-left .15s ease;
  }
  .link:last-child{border-bottom:none;}
  .link:hover{color:var(--white);padding-left:6px;}
  .link svg{width:16px;height:16px;flex-shrink:0;opacity:.55;transition:opacity .15s;}
  .link:hover svg{opacity:1;}
  .link.fill svg{fill:currentColor;stroke:none;}
  .link.stroke svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  @media (max-width:480px){
    .topbar{padding:20px 20px;}
    .stats{gap:18px;padding:12px 18px;}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
  }
</style>
</head>

<script>
(function(){
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let w, h, dpr;
  let particles = [];
  const mouse = { x: null, y: null, active: false };

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initParticles();
  }

  function initParticles(){
    // more particles, original speed
    const density = Math.min(95, Math.floor((w * h) / 14500));
    particles = [];
    for (let i = 0; i < density; i++){
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.22,
        vy: (Math.random() - 0.5) * 0.22,
        r: Math.random() * 1.4 + 0.6
      });
    }
  }

  const LINK_DIST = 155;
  const MOUSE_DIST = 190;

  function step(){
    ctx.clearRect(0, 0, w, h);

    for (const p of particles){
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
      p.x = Math.max(0, Math.min(w, p.x));
      p.y = Math.max(0, Math.min(h, p.y));

      if (mouse.active){
        const dx = p.x - mouse.x, dy = p.y - mouse.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < MOUSE_DIST && dist > 0.01){
          const force = (1 - dist / MOUSE_DIST) * 0.035;
          p.vx += (dx / dist) * force;
          p.vy += (dy / dist) * force;
        }
      }
      const speed = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
      const maxSpeed = 0.6;
      if (speed > maxSpeed){
        p.vx = (p.vx / speed) * maxSpeed;
        p.vy = (p.vy / speed) * maxSpeed;
      }
    }

    for (let i = 0; i < particles.length; i++){
      for (let j = i + 1; j < particles.length; j++){
        const a = particles[i], b = particles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < LINK_DIST){
          const op = (1 - dist / LINK_DIST) * 0.14;
          ctx.strokeStyle = 'rgba(255,255,255,' + op + ')';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
      if (mouse.active){
        const dx = particles[i].x - mouse.x, dy = particles[i].y - mouse.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < MOUSE_DIST){
          const op = (1 - dist / MOUSE_DIST) * 0.28;
          ctx.strokeStyle = 'rgba(255,255,255,' + op + ')';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(mouse.x, mouse.y);
          ctx.stroke();
        }
      }
    }

    for (const p of particles){
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.fill();
    }

    if (!reduceMotion) requestAnimationFrame(step);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  });
  window.addEventListener('mouseleave', () => { mouse.active = false; });
  window.addEventListener('touchmove', (e) => {
    if (e.touches[0]){ mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; mouse.active = true; }
  }, {passive:true});
  window.addEventListener('touchend', () => { mouse.active = false; });

  // organic 3D tilt on avatar (mouse-follow, not generic)
  (function(){
    const wrap = document.querySelector('.avatar-wrap');
    const img = document.querySelector('.avatar');
    if (!wrap || !img || reduceMotion) return;

    let raf = null;
    let currentX = 0, currentY = 0;
    let targetX = 0, targetY = 0;

    function lerp(a, b, t){ return a + (b - a) * t; }

    function onMove(e){
      const rect = wrap.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width;
      const py = (e.clientY - rect.top) / rect.height;
      // very subtle tilt (~2.5deg max)
      targetX = (0.5 - py) * 5;
      targetY = (px - 0.5) * 5;
    }

    function onLeave(){
      targetX = 0;
      targetY = 0;
    }

    function tick(){
      currentX = lerp(currentX, targetX, 0.1);
      currentY = lerp(currentY, targetY, 0.1);

      const settled = Math.abs(currentX) < 0.1 && Math.abs(currentY) < 0.1 &&
                      targetX === 0 && targetY === 0;

      if (settled) {
        img.style.transform = '';
        raf = null;
        return;
      }

      img.style.transform =
        `rotateX(${currentX.toFixed(2)}deg) rotateY(${currentY.toFixed(2)}deg)`;
      raf = requestAnimationFrame(tick);
    }

    wrap.addEventListener('mousemove', onMove);
    wrap.addEventListener('mouseenter', () => {
      if (!raf) raf = requestAnimationFrame(tick);
    });
    wrap.addEventListener('mouseleave', onLeave);
  })();

  resize();
  if (reduceMotion){ step(); } else { requestAnimationFrame(step); }
})();
</script>

</body>
